<!DOCTYPE html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Login Screen</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#2b6cee",
              "background-light": "#f6f6f8",
              "background-dark": "#101622",
              "lazuli-blue": "#26619C",
              "medical-green": "#2A9D8F",
            },
            fontFamily: {
              "display": ["Manrope", "sans-serif"]
            },
            borderRadius: {
              "DEFAULT": "0.25rem",
              "lg": "0.5rem",
              "xl": "0.75rem",
              "full": "9999px"
            },
          },
        },
      }
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        font-size: 24px;
      }
    </style>
  </head>
  <body class="font-display">
    <div class="relative flex min-h-screen w-full flex-col items-center justify-center overflow-hidden bg-gradient-to-br from-lazuli-blue to-medical-green p-4 md:p-6 lg:p-8">
      <div class="w-full max-w-md">
        <div class="mb-8 flex flex-col items-center">
          <div class="mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-white/20">
            <span class="material-symbols-outlined text-white" style="font-size: 32px; font-variation-settings: 'wght' 300;">health_and_safety</span>
          </div>
          <h1 class="font-display text-2xl font-bold text-white">LaraGila</h1>
        </div>

        <div class="rounded-xl bg-white shadow-2xl dark:bg-background-dark">
          <div class="p-8 sm:p-10">
            
            <div class="flex flex-col gap-4">
              
              <div class="flex flex-col">
                <label class="flex flex-col min-w-40 flex-1">
                  <p class="font-display text-[#111318] dark:text-slate-200 text-sm font-medium leading-normal pb-2">Id Perawat</p>
                  <input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg font-display text-[#111318] focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#dbdfe6] bg-white dark:bg-background-dark dark:border-slate-700 dark:text-white focus:border-primary h-12 placeholder:text-[#616f89] dark:placeholder:text-slate-500 px-4 py-2 text-base font-normal leading-normal" placeholder="Masukkan Id Perawat Anda" value="" />
                </label>
              </div>

              <div class="flex flex-col">
                <label class="flex flex-col min-w-40 flex-1">
                  <p class="font-display text-[#111318] dark:text-slate-200 text-sm font-medium leading-normal pb-2">Password</p>
                  <div class="relative flex w-full items-center">
                    <input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg font-display text-[#111318] focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#dbdfe6] bg-white dark:bg-background-dark dark:border-slate-700 dark:text-white focus:border-primary h-12 placeholder:text-[#616f89] dark:placeholder:text-slate-500 pl-4 pr-12 py-2 text-base font-normal leading-normal" placeholder="Masukkan Password Anda" type="password" value="" />
                    <button class="absolute inset-y-0 right-0 flex items-center pr-4 text-[#616f89] dark:text-slate-400">
                      <span class="material-symbols-outlined">visibility</span>
                    </button>
                  </div>
                </label>
              </div>

              <div>
                <p class="font-display text-primary text-sm font-medium leading-normal pt-1 underline cursor-pointer hover:text-primary/80">Forgot your password?</p>
              </div>

              <div class="pt-4">
                <button class="flex min-w-[84px] w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] transition-colors hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary dark:focus:ring-offset-background-dark">
                  <span class="truncate font-display">Login</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="mt-8 text-center">
          <p class="text-sm text-white/70">© 2024 LaraGila. All Rights Reserved.</p>
        </div>
      </div>
    </div>
  </body>
</html>
